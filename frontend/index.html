<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/baton.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1726" />
    <title>Baton — knowledge handover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
    <style>
      /* First-load splash. Plain CSS so it shows before the app's code arrives; the app fades it out. */
      #splash {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background:
          radial-gradient(38rem 26rem at 20% 10%, rgb(52 70 212 / 0.35), transparent 60%),
          radial-gradient(30rem 22rem at 85% 90%, rgb(232 163 61 / 0.18), transparent 60%),
          #0e1726;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #fff;
      }
      #splash .mark { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      #splash .row { display: flex; align-items: center; gap: 12px; }
      #splash svg { width: 60px; height: 60px; overflow: visible; filter: drop-shadow(0 12px 32px rgb(232 163 61 / 0.25)); }
      #splash .stem { stroke-dasharray: 23; animation: s-draw23 .55s cubic-bezier(.22,1,.36,1) .15s both; }
      #splash .bowl { stroke-dasharray: 34; animation: s-draw34 .8s cubic-bezier(.22,1,.36,1) .5s both; }
      #splash .word { font-size: 40px; font-weight: 650; letter-spacing: -0.035em; animation: s-rise .6s cubic-bezier(.22,1,.36,1) .55s both; }
      #splash .tag { font-size: 14px; color: #9aa4b5; animation: s-rise .6s cubic-bezier(.22,1,.36,1) .8s both; }
      #splash .bar { width: 160px; height: 2px; border-radius: 2px; overflow: hidden; background: rgb(255 255 255 / 0.08); animation: s-rise .5s ease 1s both; }
      #splash .bar::after { content: ""; display: block; height: 100%; width: 40%; border-radius: 2px;
        background: linear-gradient(90deg, transparent, #e8a33d, transparent); animation: s-run 1.1s ease-in-out infinite; }
      #splash.out { animation: s-out .55s cubic-bezier(.22,1,.36,1) forwards; pointer-events: none; }
      @keyframes s-pop { from { opacity: 0; transform: scale(.7) rotate(-8deg); } to { opacity: 1; transform: none; } }
      @keyframes s-draw23 { from { stroke-dashoffset: 23; } to { stroke-dashoffset: 0; } }
      @keyframes s-draw34 { from { stroke-dashoffset: 34; } to { stroke-dashoffset: 0; } }
      @keyframes s-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes s-run { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @keyframes s-out { to { opacity: 0; transform: scale(1.04); visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Baton">
      <div class="mark">
        <div class="row">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path class="stem" d="M7.25 4.5V26.5" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" />
            <path class="bowl" d="M13.32 14.3A7 7 0 1 1 13.32 24.7" stroke="#E8A33D" stroke-width="5.5" stroke-linecap="round" />
          </svg>
          <span class="word">baton</span>
        </div>
        <span class="tag">Every handover sentence carries its receipt.</span>
        <span class="bar" aria-hidden="true"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
