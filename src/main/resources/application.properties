spring.application.name=baton

# "Home" database: Baton's own Postgres (docker-compose, host port 5433). It holds the workspace registry
# (control schema) and the demo workspace. Each company's data lives in that company's own database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/baton}
spring.datasource.username=${DB_USER:baton}
spring.datasource.password=${DB_PASSWORD:baton}

# JPA: Flyway owns the schema. There is no single database at startup (each workspace has its own),
# so Hibernate must not connect while booting.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway runs per workspace (TenantBootstrap, workspace sign-up), not once at startup
spring.flyway.enabled=false
# No schema.sql/data.sql scripts; Flyway owns the schema.
spring.sql.init.mode=never

# Workspaces
# Sign-in without a workspace name goes here (keeps the demo and old clients working).
baton.tenants.default-workspace=demo
# Self-service sign-up refuses databases on localhost / private networks (SSRF). Allow only for local development.
baton.tenants.allow-private-hosts=${ALLOW_PRIVATE_DB_HOSTS:false}

# Uploads (25 MB limit from the validation rules)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# JWT: HS256, secret must be at least 32 bytes, 8 h expiry
baton.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-at-least-32-bytes!!}
baton.jwt.expiry-hours=8

# AES-256-GCM key (base64, 32 bytes) for redacted originals and staged uploads.
# Generate a real one for any deployment:  openssl rand -base64 32
baton.crypto.key=${CRYPTO_KEY:bG9jYWwtZGV2LW9ubHktYWVzLWtleS0zMi1ieXRlcyE=}

# Background jobs and local embeddings
baton.jobs.enabled=true
baton.jobs.concurrency=2
baton.embeddings.enabled=${EMBEDDINGS_ENABLED:true}

# GitHub (read-only token, optional for public repos)
baton.github.token=${GITHUB_TOKEN:}

# Groq
baton.groq.api-key=${GROQ_API_KEY:}
baton.groq.base-url=https://api.groq.com/openai/v1
baton.groq.extract-model=llama-3.3-70b-versatile
baton.groq.light-model=llama-3.1-8b-instant
# true = replay recorded responses, so the demo works offline
baton.ai.mock=${AI_MOCK:true}

# Demo personas for synthetic "Project Annapurna" (test accounts only)
baton.demo.seed=${DEMO_SEED:true}
baton.demo.password=${DEMO_PASSWORD:annapurna-demo}
# The shared demo workspace refuses changes that would break it for the next visitor (see DemoGuard).
baton.demo.locked=${DEMO_LOCKED:true}

# CORS for the React dev server
baton.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health,info
# The DB health check has no workspace to ask; workspaces report their own problems.
management.health.db.enabled=false

# --- No company content in Baton's logs ---
# These loggers can print SQL values, request bodies or parse errors that quote what was sent.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.jdbc.core=WARN
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
logging.level.org.apache.coyote.http11=WARN
# Flyway prints the company database address at INFO when it migrates a workspace.
logging.level.org.flywaydb=WARN

# --- Limits on endpoints anyone can call ---
baton.limits.login-per-ip=${LOGIN_PER_IP:30}
baton.limits.login-failures-per-account=${LOGIN_FAILURES_PER_ACCOUNT:8}
baton.limits.signup-per-ip=${SIGNUP_PER_IP:5}
baton.limits.lookup-per-ip=${LOOKUP_PER_IP:60}

# --- Email (password reset, invitations, share notices) ---
# Off unless RESEND_API_KEY is set. APP_URL is the web app's address, used in the links.
baton.mail.resend-api-key=${RESEND_API_KEY:}
baton.mail.from=${MAIL_FROM:Baton <onboarding@resend.dev>}
baton.app-url=${APP_URL:http://localhost:5173}

# --- Plans and payments ---
# Free plan limits; the Team plan is paid monthly through Razorpay payment links. Payments stay off until all
# three Razorpay values are set. Amounts are in the currency's minor unit (paise).
baton.billing.free.people=${FREE_PEOPLE:5}
baton.billing.free.projects=${FREE_PROJECTS:1}
baton.billing.free.sources=${FREE_SOURCES:10}
baton.billing.team.price-minor=${TEAM_PRICE_MINOR:499900}
baton.billing.currency=${BILLING_CURRENCY:INR}
baton.billing.razorpay.key-id=${RAZORPAY_KEY_ID:}
baton.billing.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
baton.billing.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Automatic sync of live sources (GitHub, Slack, Google Drive, Jira). The tick is how often each workspace is asked
# which sources are due; a source is read again when it was last checked more than interval-minutes ago.
baton.sync.enabled=${SYNC_ENABLED:true}
baton.sync.tick-minutes=${SYNC_TICK_MINUTES:30}
baton.sync.interval-minutes=${SYNC_INTERVAL_MINUTES:60}
baton.sync.initial-delay-minutes=3

# One-click connections ("Connect with Slack / GitHub / Google"). PUBLIC_URL is this API's public address, used for
# the redirect address registered with each tool: {PUBLIC_URL}/api/oauth/{slack|github|google_drive}/callback.
baton.public-url=${API_PUBLIC_URL:}
baton.oauth.slack.client-id=${SLACK_CLIENT_ID:}
baton.oauth.slack.client-secret=${SLACK_CLIENT_SECRET:}
baton.oauth.github.client-id=${GITHUB_CLIENT_ID:}
baton.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}
baton.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
baton.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Team room video calls. Video goes browser to browser; these are the servers browsers use to find each other.
# STUN works for most networks. Add a TURN relay (TURN_URL, e.g. turn:turn.example.com:3478) for strict firewalls.
baton.call.stun=${CALL_STUN_URL:stun:stun.l.google.com:19302}
baton.call.turn-url=${TURN_URL:}
baton.call.turn-username=${TURN_USERNAME:}
baton.call.turn-credential=${TURN_CREDENTIAL:}
