spring.application.name=baton

# "Home" database: Baton's own Postgres (docker-compose, host port 5433). It holds the workspace registry
# (control schema) and the demo workspace. Each company's data lives in that company's own database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/baton}
spring.datasource.username=${DB_USER:baton}
spring.datasource.password=${DB_PASSWORD:baton}

# JPA: Flyway owns the schema. There is no single database at startup (each workspace has its own),
# so Hibernate must not connect while booting.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway runs per workspace (TenantBootstrap, workspace sign-up), not once at startup
spring.flyway.enabled=false
# No schema.sql/data.sql scripts; Flyway owns the schema.
spring.sql.init.mode=never

# Workspaces
# Sign-in without a workspace name goes here (keeps the demo and old clients working).
baton.tenants.default-workspace=demo
# Self-service sign-up refuses databases on localhost / private networks (SSRF). Allow only for local development.
baton.tenants.allow-private-hosts=${ALLOW_PRIVATE_DB_HOSTS:false}

# Uploads (25 MB limit from the validation rules)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# JWT: HS256, secret must be at least 32 bytes, 8 h expiry
baton.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-at-least-32-bytes!!}
baton.jwt.expiry-hours=8

# AES-256-GCM key (base64, 32 bytes) for redacted originals and staged uploads.
# Generate a real one for any deployment:  openssl rand -base64 32
baton.crypto.key=${CRYPTO_KEY:bG9jYWwtZGV2LW9ubHktYWVzLWtleS0zMi1ieXRlcyE=}

# Background jobs and local embeddings
baton.jobs.enabled=true
baton.jobs.concurrency=2
baton.embeddings.enabled=${EMBEDDINGS_ENABLED:true}

# GitHub (read-only token, optional for public repos)
baton.github.token=${GITHUB_TOKEN:}

# Groq
baton.groq.api-key=${GROQ_API_KEY:}
baton.groq.base-url=https://api.groq.com/openai/v1
baton.groq.extract-model=llama-3.3-70b-versatile
baton.groq.light-model=llama-3.1-8b-instant
# true = replay recorded responses, so the demo works offline
baton.ai.mock=${AI_MOCK:true}

# Demo personas for synthetic "Project Annapurna" (test accounts only)
baton.demo.seed=${DEMO_SEED:true}
baton.demo.password=${DEMO_PASSWORD:annapurna-demo}

# CORS for the React dev server
baton.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health,info
# The DB health check has no workspace to ask; workspaces report their own problems.
management.health.db.enabled=false
