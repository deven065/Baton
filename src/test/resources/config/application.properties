# Test-only overrides (loaded on top of the main application.properties).
# Tests query the demo workspace directly with JdbcClient, outside any request.
baton.tenants.fallback-workspace=demo
# Tests register workspaces in the Testcontainers Postgres on localhost.
baton.tenants.allow-private-hosts=true
# Every test signs in from 127.0.0.1; keep the per-address limits out of the way (RateLimitApiTest lowers them).
baton.limits.login-per-ip=100000
baton.limits.signup-per-ip=100000
baton.limits.lookup-per-ip=100000
